<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>TECSYCOM · PERUFIBRA | Gestor CSV + Estados</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <script src="https://cdn.sheetjs.com/xlsx-0.20.2/package/dist/xlsx.full.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: #EFF3F8; font-family: 'Inter', system-ui, sans-serif; font-size: 13px; height: 100vh; overflow: hidden; }
        .tc-app { display: flex; flex-direction: column; height: 100vh; background: white; overflow: hidden; }
        .tc-header { background: linear-gradient(98deg, #0D1B3E 0%, #1A2F5A 100%); padding: 12px 24px; display: flex; align-items: center; justify-content: space-between; flex-shrink: 0; color: white; }
        .tc-logo-badge { background: white; color: #0D1B3E; font-weight: 700; font-size: 13px; padding: 5px 14px; border-radius: 40px; }
        .tc-toolbar { background: white; padding: 12px 20px; display: flex; gap: 12px; flex-wrap: wrap; align-items: center; border-bottom: 1px solid #E2EDF2; flex-shrink: 0; }
        .tc-btn { display: inline-flex; align-items: center; gap: 8px; padding: 6px 14px; font-size: 12px; font-weight: 500; border-radius: 12px; background: #FFFFFF; border: 1px solid #CAD5E2; color: #1F2F40; cursor: pointer; transition: 0.2s; }
        .tc-btn.primary { background: #0F6E56; border-color: #0F6E56; color: white; }
        .tc-btn.accent { background: #1E4A76; border-color: #1E4A76; color: white; }
        .tc-search-col { flex: 1; min-width: 280px; display: flex; gap: 8px; align-items: center; background: #F8FAFE; border: 1px solid #D0DDEB; border-radius: 40px; padding: 4px 8px 4px 16px; }
        .tc-search-col input { flex: 1; background: transparent; border: none; outline: none; font-size: 12px; }
        .tc-search-col select { background: transparent; border: none; outline: none; font-size: 12px; }
        .tc-stats { background: #EEF3FA; border-radius: 40px; padding: 4px 14px; font-weight: 500; }
        
        .tc-statsbar { background: #F9FCFE; padding: 10px 20px; border-bottom: 1px solid #E4ECF3; display: flex; gap: 12px; flex-wrap: wrap; flex-shrink: 0; align-items: center; }
        .stat-chip { padding: 5px 14px; border-radius: 30px; font-weight: 600; font-size: 11px; cursor: pointer; transition: 0.2s; border: 1px solid transparent; }
        .stat-chip:hover { transform: scale(1.02); box-shadow: 0 2px 6px rgba(0,0,0,0.1); }
        .stat-chip.active { border-color: #0F6E56; box-shadow: 0 0 0 2px rgba(15,110,86,0.2); }
        .stat-en-proceso { background: #E3F2FD; color: #1565C0; }
        .stat-programado { background: #E8F5E9; color: #2E7D32; }
        .stat-coordinado { background: #FFF3E0; color: #E65100; }
        .stat-finalizado { background: #E0F2EC; color: #0F6E56; }
        .stat-cancelado { background: #FFEBEE; color: #C62828; }
        .stat-ausente { background: #FCE4EC; color: #AD1457; }
        .stat-en-camino { background: #F3E5F5; color: #6A1B9A; }
        .stat-reprograma { background: #FFF8E1; color: #F57F17; }
        .stat-transferir { background: #E8EAF6; color: #283593; }
        .stat-planta { background: #EFEBE9; color: #5D4037; }
        .stat-default { background: #ECEFF1; color: #455A64; }
        
        .tc-table-wrapper { flex: 1; overflow: auto; position: relative; background: #FFFFFF; width: 100%; }
        .tc-table { border-collapse: collapse; min-width: 100%; font-size: 12px; }
        .tc-table th { background: #F4F9FF; position: sticky; top: 0; z-index: 20; padding: 12px 16px; font-weight: 600; border-bottom: 1px solid #DCE5EF; border-right: 1px solid #E9EFF4; white-space: nowrap; cursor: pointer; text-transform: uppercase; font-size: 11px; letter-spacing: 0.04em; }
        .tc-table td { padding: 10px 14px; border-bottom: 0.5px solid #ECF2F8; border-right: 0.5px solid #ECF2F8; white-space: nowrap; background-color: white; }
        .tc-table tr:hover td { background: #FEF9E6; cursor: pointer; }
        
        .state-select { width: 140px; padding: 6px 8px; border-radius: 20px; border: 1px solid #C0D0E2; background-color: #FFFFFF; font-size: 11px; font-weight: 500; cursor: pointer; }
        .editable-input { width: 100%; min-width: 120px; padding: 4px 8px; border: 1px solid #0F6E56; border-radius: 8px; background: white; font-size: 12px; outline: none; }
        
        .tc-pager { padding: 10px 20px; border-top: 1px solid #E2ECF5; background: white; display: flex; align-items: center; justify-content: space-between; flex-shrink: 0; }
        .tc-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.55); backdrop-filter: blur(3px); display: flex; align-items: center; justify-content: center; z-index: 1000; }
        .tc-modal { background: white; border-radius: 28px; width: 650px; max-width: 92vw; max-height: 85vh; overflow-y: auto; }
        .tc-cat-grid { display: flex; gap: 12px; margin: 15px 0; flex-wrap: wrap; }
        .tc-cat-opt { flex: 1; text-align: center; padding: 12px; border-radius: 28px; border: 1.5px solid #CFDFE9; font-weight: 600; cursor: pointer; }
        .tc-cat-opt.selected { background: #E0F2EC; border-color: #0F6E56; color: #0F6E56; }
        .tc-upload-zone { border: 2px dashed #B9D0E8; border-radius: 24px; padding: 32px; text-align: center; cursor: pointer; }
        .modal-footer { padding: 16px 24px; border-top: 1px solid #EDF2F7; display: flex; justify-content: flex-end; gap: 12px; }
        .column-actions { display: flex; gap: 10px; margin-bottom: 15px; flex-wrap: wrap; }
        .col-item { display: flex; align-items: center; gap: 10px; padding: 8px; border-bottom: 1px solid #eee; cursor: grab; user-select: none; border-radius: 8px; transition: background 0.15s; }
        .col-item:hover { background: #F0F7FF; }
        .col-item.dragging { opacity: 0.4; background: #E3F2FD; }
        .col-item.drag-over { background: #E0F2EC; border-top: 2px solid #0F6E56; }
        .col-drag-handle { color: #A0B0C0; font-size: 14px; cursor: grab; flex-shrink: 0; }
        .estado-badge { display: inline-flex; align-items: center; gap: 4px; padding: 3px 10px; border-radius: 20px; font-size: 11px; font-weight: 600; white-space: nowrap; }
        .estado-badge select { background: transparent; border: none; outline: none; font-size: 11px; font-weight: 600; cursor: pointer; padding: 0; max-width: 120px; }
        td.td-estado { min-width: 160px; padding: 5px 10px !important; }
    </style>
</head>
<body>
<div class="tc-app">
    <div class="tc-header">
        <div><span class="tc-logo-badge">TECSYCOM</span> PERUFIBRA · Gestión + Estado Inteligente</div>
        <div><span id="globalCatBadge" class="stat-chip stat-default">Sin categoría</span></div>
    </div>

    <div class="tc-toolbar">
        <button class="tc-btn primary" onclick="showUploadModal()"><i class="fas fa-upload"></i> Cargar CSV</button>
        <button class="tc-btn" onclick="showColumnManager()"><i class="fas fa-columns"></i> Columnas</button>
        <button class="tc-btn accent" onclick="exportToExcel()"><i class="fas fa-file-excel"></i> Exportar Excel</button>
        <div class="tc-search-col">
            <i class="fas fa-search"></i>
            <select id="searchColumnSelect"></select>
            <input type="text" id="specificSearchInput" placeholder="Filtrar...">
        </div>
        <span class="tc-stats" id="statsCounter">0 registros</span>
    </div>

    <div id="statsSummaryBar" class="tc-statsbar"></div>

    <div class="tc-table-wrapper" id="tableScrollWrapper">
        <div id="tableInner"></div>
    </div>

    <div class="tc-pager" id="paginationBar" style="display: none;"></div>
</div>

<!-- MODAL CARGAR CSV -->
<div id="uploadModal" class="tc-overlay" style="display: none;">
    <div class="tc-modal">
        <div style="padding:18px 24px; border-bottom:1px solid #EFF3F8; display:flex; justify-content:space-between;">
            <span><i class="fas fa-cloud-upload-alt"></i> Cargar archivo CSV</span>
            <button class="tc-btn" onclick="closeModal('uploadModal')"><i class="fas fa-times"></i></button>
        </div>
        <div style="padding:20px 24px;">
            <p><strong>Categoría del archivo:</strong></p>
            <div class="tc-cat-grid">
                <div class="tc-cat-opt" data-cat="ALTA">✅ Altas</div>
                <div class="tc-cat-opt" data-cat="AVERIA">⚠️ Averías</div>
                <div class="tc-cat-opt" data-cat="GARANTIA">🛡️ Garantía</div>
                <div class="tc-cat-opt" data-cat="POSTVENTA">📞 Postventa</div>
            </div>
            <div class="tc-upload-zone" id="dropZone" onclick="document.getElementById('csvFileInput').click()" ondragover="dragOverHandler(event)" ondragleave="dragLeaveHandler(event)" ondrop="dropHandler(event)">
                <i class="fas fa-file-csv" style="font-size: 34px;"></i>
                <div>Arrastra o haz clic para seleccionar CSV</div>
                <input type="file" id="csvFileInput" accept=".csv" style="display:none" onchange="handleFileSelect(event)">
            </div>
            <div id="uploadInfo" style="margin-top:12px; font-size:12px;"></div>
        </div>
        <div class="modal-footer"><button class="tc-btn" onclick="closeModal('uploadModal')">Cancelar</button></div>
    </div>
</div>

<!-- MODAL COLUMNAS MEJORADO -->
<div id="columnsModal" class="tc-overlay" style="display: none;">
    <div class="tc-modal">
        <div style="padding:18px 24px; border-bottom:1px solid #EFF3F8; display:flex; justify-content:space-between;">
            <span><i class="fas fa-columns"></i> Configurar columnas visibles</span>
            <button class="tc-btn" onclick="closeModal('columnsModal')"><i class="fas fa-times"></i></button>
        </div>
        <div style="padding:20px 24px;">
            <div class="column-actions">
                <button class="tc-btn tc-btn-sm" onclick="selectAllColumns(true)"><i class="fas fa-check-square"></i> Seleccionar todo</button>
                <button class="tc-btn tc-btn-sm" onclick="selectAllColumns(false)"><i class="fas fa-square"></i> Deseleccionar todo</button>
                <input type="text" id="colFilterInput" placeholder="🔍 Buscar columna..." style="flex:1; padding:6px 12px; border-radius:20px; border:1px solid #CAD5E2;">
            </div>
            <div id="columnListContainer" style="max-height: 350px; overflow-y: auto; border: 1px solid #E2EDF7; border-radius: 16px;"></div>
        </div>
        <div class="modal-footer">
            <button class="tc-btn" onclick="closeModal('columnsModal')">Cancelar</button>
            <button class="tc-btn primary" onclick="applyColumnChanges()">Aplicar cambios</button>
        </div>
    </div>
</div>

<script>
    const ESTADOS_OPCIONES = ["EN PROCESO", "REPROGRAMA", "PROGRAMADO", "AUSENTE", "CANCELADO", "EN CAMINO", "COORDINADO", "FINALIZADO", "TRANSFERIR", "PLANTA", "ZONA PELIGROSA", "DUPLICADO"];

    const estadoColors = {
        "EN PROCESO": "stat-en-proceso", "PROGRAMADO": "stat-programado", "COORDINADO": "stat-coordinado",
        "FINALIZADO": "stat-finalizado", "CANCELADO": "stat-cancelado", "AUSENTE": "stat-ausente",
        "EN CAMINO": "stat-en-camino", "REPROGRAMA": "stat-reprograma", "TRANSFERIR": "stat-transferir", "PLANTA": "stat-planta"
    };

    let state = {
        currentCategory: null,
        dataCategories: { ALTA: [], AVERIA: [], GARANTIA: [], POSTVENTA: [] },
        allColumns: [],
        columnConfig: [],
        filteredRows: [],
        sortCol: null, sortDir: 1,
        currentPage: 0, rowsPerPage: 50,
        searchKeyword: "", selectedSearchCol: "", activeFilterEstado: null
    };

    function getEstadoColumn() { 
        // Buscar columna que contenga "estado" (case insensitive)
        return state.allColumns.find(col => col.toLowerCase() === "estado" || col.toLowerCase().includes("estado")) || null; 
    }

    function updateEstadoValue(rowIndex, newValue) {
        if (!state.filteredRows[rowIndex]) return;
        const estadoCol = getEstadoColumn();
        if (estadoCol) {
            state.filteredRows[rowIndex][estadoCol] = newValue;
            const originalDataset = state.dataCategories[state.currentCategory];
            const keyField = state.allColumns[0];
            const keyValue = state.filteredRows[rowIndex][keyField];
            const originalRow = originalDataset.find(r => r[keyField] === keyValue);
            if (originalRow) originalRow[estadoCol] = newValue;
            renderTable();
            updateStatsBar();
        }
    }

    function updateCellValue(rowIndex, colName, newValue) {
        if (!state.filteredRows[rowIndex]) return;
        state.filteredRows[rowIndex][colName] = newValue;
        const originalDataset = state.dataCategories[state.currentCategory];
        const keyField = state.allColumns[0];
        const keyValue = state.filteredRows[rowIndex][keyField];
        const originalRow = originalDataset.find(r => r[keyField] === keyValue);
        if (originalRow) originalRow[colName] = newValue;
    }

    function startInlineEdit(rowIndex, colName, element) {
        const currentValue = state.filteredRows[rowIndex][colName] || "";
        const input = document.createElement("input");
        input.type = "text";
        input.value = currentValue;
        input.className = "editable-input";
        input.onblur = () => {
            const newValue = input.value;
            if (newValue !== currentValue) updateCellValue(rowIndex, colName, newValue);
            renderTable();
        };
        input.onkeypress = (e) => { if (e.key === "Enter") input.blur(); };
        element.innerHTML = "";
        element.appendChild(input);
        input.focus();
        input.select();
    }

    function renderTable() {
        const container = document.getElementById('tableInner');
        const visibleCols = state.columnConfig.filter(c => c.visible);
        let data = [...state.filteredRows];
        if (state.activeFilterEstado) {
            const estadoCol = getEstadoColumn();
            if (estadoCol) data = data.filter(row => row[estadoCol] === state.activeFilterEstado);
        }
        if (!data.length || !visibleCols.length) {
            container.innerHTML = `<div style="text-align:center; padding:60px;"><i class="fas fa-table" style="font-size:48px; opacity:0.3;"></i><p>Sin datos para mostrar</p></div>`;
            return;
        }
        const start = state.currentPage * state.rowsPerPage;
        const pageRows = data.slice(start, start + state.rowsPerPage);
        const estadoCol = getEstadoColumn();
        let html = `<table class="tc-table"><thead>`;
        html += `<th style="position:sticky; left:0; background:#F4F9FF; z-index:25; min-width:50px;">#</th>`;
        visibleCols.forEach(col => {
            let arrow = (state.sortCol === col.orig) ? (state.sortDir === 1 ? ' ↑' : ' ↓') : '';
            html += `<th onclick="setSortColumn('${escapeHtml(col.orig)}')">${escapeHtml(col.label)}${arrow}</th>`;
        });
        html += `</thead><tbody>`;
        pageRows.forEach((row, idx) => {
            const realIndex = state.filteredRows.indexOf(row);
            html += `<tr>`;
            html += `<td style="position:sticky; left:0; background:white; z-index:10; font-weight:500;">${start + idx + 1}</td>`;
            visibleCols.forEach(col => {
                let val = row[col.orig] !== undefined && row[col.orig] !== null ? row[col.orig] : "";
                if (col.orig === estadoCol) {
                    const valUpper = (val || "").replace(/[\u00A0\u200B\uFEFF]/g, "").replace(/\s+/g, " ").trim().toUpperCase();
                    const colorClass = estadoColors[valUpper] || "stat-default";
                    let selectHtml = `<select onchange="updateEstadoValue(${realIndex}, this.value)" style="background:transparent;border:none;outline:none;font-size:11px;font-weight:600;cursor:pointer;color:inherit;max-width:130px;">`;
                    let hasMatch = ESTADOS_OPCIONES.includes(valUpper);
                    ESTADOS_OPCIONES.forEach(opt => {
                        const selected = (opt === valUpper) ? 'selected' : '';
                        selectHtml += `<option value="${escapeHtml(opt)}" ${selected}>${escapeHtml(opt)}</option>`;
                    });
                    if (!hasMatch && valUpper !== "") {
                        selectHtml += `<option value="${escapeHtml(valUpper)}" selected>${escapeHtml(valUpper)}</option>`;
                    }
                    selectHtml += `</select>`;
                    html += `<td class="td-estado"><span class="stat-chip ${colorClass}" style="display:inline-flex;align-items:center;gap:4px;padding:3px 10px;font-size:11px;">${selectHtml}</span></td>`;
                } else {
                    html += `<td ondblclick="startInlineEdit(${realIndex}, '${escapeHtml(col.orig)}', this)">${escapeHtml(val.toString().substring(0, 75))}</td>`;
                }
            });
            html += `</tr>`;
        });
        html += `</tbody></table>`;
        container.innerHTML = html;
        renderPagination(data.length);
    }

    function updateStatsBar() {
        const data = state.filteredRows;
        const barDiv = document.getElementById('statsSummaryBar');
        if (!data.length || !state.currentCategory) { barDiv.innerHTML = ''; return; }
        const estadoCol = getEstadoColumn();
        if (!estadoCol) { 
            barDiv.innerHTML = `<span class="stat-chip stat-default">📊 Total: ${data.length} registros</span>`; 
            return; 
        }
        let estadoCount = {};
        data.forEach(r => { 
            let e = r[estadoCol] || 'Sin Estado'; 
            estadoCount[e] = (estadoCount[e] || 0) + 1; 
        });
        let html = `<span class="stat-chip stat-default" onclick="filterByEstado(null)" style="cursor:pointer;">📊 Total: ${data.length}</span>`;
        for (let [estado, count] of Object.entries(estadoCount)) {
            let colorClass = estadoColors[estado] || "stat-default";
            let activeClass = (state.activeFilterEstado === estado) ? 'active' : '';
            html += `<span class="stat-chip ${colorClass} ${activeClass}" onclick="filterByEstado('${escapeHtml(estado)}')" style="cursor:pointer;">${count} ${estado}</span>`;
        }
        barDiv.innerHTML = html;
    }

    function filterByEstado(estado) { state.activeFilterEstado = estado; state.currentPage = 0; renderTable(); updateStatsBar(); }
    function setSortColumn(col) { if (state.sortCol === col) state.sortDir *= -1; else { state.sortCol = col; state.sortDir = 1; } applyFiltersAndRender(); }
    
    function applyFiltersAndRender() {
        let data = getCurrentDataset();
        const kw = state.searchKeyword.trim().toLowerCase();
        const colFilter = state.selectedSearchCol;
        if (kw !== "") {
            if (colFilter === "") data = data.filter(row => Object.values(row).some(v => v && v.toString().toLowerCase().includes(kw)));
            else data = data.filter(row => row[colFilter] && row[colFilter].toString().toLowerCase().includes(kw));
        }
        if (state.sortCol) {
            data.sort((a, b) => {
                let av = a[state.sortCol] || "", bv = b[state.sortCol] || "";
                return av.localeCompare(bv) * state.sortDir;
            });
        }
        state.filteredRows = data;
        state.currentPage = 0;
        renderTable();
        updateStatsBar();
        document.getElementById('statsCounter').innerText = state.filteredRows.length + " registros";
        updateColumnSelector();
    }

    function getCurrentDataset() { return state.currentCategory ? (state.dataCategories[state.currentCategory] || []) : []; }
    
    function updateColumnSelector() {
        const select = document.getElementById('searchColumnSelect');
        let opts = '<option value="">🔍 Todas las columnas</option>';
        state.columnConfig.filter(c => c.visible).forEach(col => opts += `<option value="${escapeHtml(col.orig)}">${escapeHtml(col.label)}</option>`);
        select.innerHTML = opts;
        select.value = state.selectedSearchCol;
        select.onchange = (e) => { state.selectedSearchCol = e.target.value; applyFiltersAndRender(); };
    }

    function renderPagination(totalRows) {
        const pages = Math.ceil(totalRows / state.rowsPerPage);
        const bar = document.getElementById('paginationBar');
        if (pages <= 1) { bar.style.display = 'none'; return; }
        bar.style.display = 'flex';
        bar.innerHTML = `<div>Página ${state.currentPage + 1} de ${pages}</div>
        <div><button class="tc-btn" onclick="changePage(${state.currentPage - 1})" ${state.currentPage === 0 ? 'disabled' : ''}>‹ Anterior</button>
        <button class="tc-btn" onclick="changePage(${state.currentPage + 1})" ${state.currentPage >= pages - 1 ? 'disabled' : ''}>Siguiente ›</button></div>`;
    }

    function changePage(p) { const total = state.filteredRows.length; const pages = Math.ceil(total / state.rowsPerPage); if (p >= 0 && p < pages) { state.currentPage = p; renderTable(); renderPagination(total); } }

    function parseCSVToArray(text) {
        // Detectar separador (; o ,)
        const firstLine = text.split(/\r?\n/)[0];
        const separator = firstLine.includes(';') ? ';' : ',';
        
        const lines = text.split(/\r?\n/);
        return lines.map(line => {
            let cols = [], cur = "", inQ = false;
            for (let i = 0; i < line.length; i++) {
                let ch = line[i];
                if (ch === '"') inQ = !inQ;
                else if (ch === separator && !inQ) { cols.push(cur); cur = ""; }
                else cur += ch;
            }
            cols.push(cur);
            return cols.map(c => c.replace(/^"|"$/g, '').trim());
        }).filter(row => row.length > 1 && row.some(cell => cell !== ""));
    }

    function processCSVFile(file) {
        if (!window._selectedTempCat) { alert("Selecciona una categoría"); return; }
        const reader = new FileReader();
        reader.onload = (ev) => {
            const text = ev.target.result;
            const parsed = parseCSVToArray(text);
            if (parsed.length < 2) { alert("CSV inválido o vacío"); return; }
            
            let headers = parsed[0].map(h => h.trim()).filter(h => h);
            const rows = parsed.slice(1).filter(r => r.some(cell => cell && cell !== ""));
            
            // Buscar columna Estado (case insensitive)
            let estadoOriginalIndex = -1;
            let estadoOriginalName = null;
            for (let i = 0; i < headers.length; i++) {
                const headerLower = headers[i].toLowerCase();
                if (headerLower === "estado" || headerLower.includes("estado")) {
                    estadoOriginalIndex = i;
                    estadoOriginalName = headers[i];
                    break;
                }
            }
            
            const newRecords = rows.map(row => {
                let obj = {};
                headers.forEach((h, i) => {
                    obj[h] = (row[i] || "").trim();
                });
                // Respetar el valor original de la columna Estado del CSV
                if (estadoOriginalIndex !== -1) {
                    const valorEstadoCSV = (row[estadoOriginalIndex] || "").trim();
                    // Normalizar: eliminar caracteres invisibles, espacios dobles y convertir a MAYÚSCULA
                    const valorNorm = valorEstadoCSV.replace(/[\u00A0\u200B\uFEFF]/g, "").replace(/\s+/g, " ").trim().toUpperCase();
                    if (valorNorm !== "") {
                        // Buscar coincidencia exacta en ESTADOS_OPCIONES (ya están en mayúscula)
                        const match = ESTADOS_OPCIONES.find(opt => opt === valorNorm);
                        obj[estadoOriginalName] = match || valorNorm;
                    } else if (!obj[estadoOriginalName] || obj[estadoOriginalName] === "") {
                        obj[estadoOriginalName] = "EN PROCESO";
                    }
                } else if (!obj["Estado"] || obj["Estado"] === "") {
                    obj["Estado"] = "EN PROCESO";
                }
                return obj;
            });
            
            const cat = window._selectedTempCat;
            const existing = state.dataCategories[cat];
            const keyField = headers[0];
            const existingKeys = new Set(existing.map(r => r[keyField]));
            let added = 0;
            
            newRecords.forEach(rec => {
                if (!existingKeys.has(rec[keyField])) {
                    existing.push(rec);
                    added++;
                }
            });
            
            // Inicializar columnas si es primera vez
            if (state.allColumns.length === 0) {
                // Asegurar que Estado esté en los headers
                const hasEstado = headers.some(h => h.toLowerCase() === "estado" || h.toLowerCase().includes("estado"));
                if (!hasEstado) headers.push("Estado");
                state.allColumns = [...headers];
                state.columnConfig = state.allColumns.map(h => ({ orig: h, label: h, visible: true }));
            }
            
            state.currentCategory = cat;
            updateGlobalBadge();
            applyFiltersAndRender();
            document.getElementById('uploadInfo').innerHTML = `<i class="fas fa-check-circle" style="color:#0F6E56;"></i> ✅ ${added} registros nuevos añadidos. Estados respetados desde el archivo.`;
            setTimeout(() => { closeModal('uploadModal'); document.getElementById('uploadInfo').innerHTML = ''; }, 2000);
        };
        reader.readAsText(file, "UTF-8");
    }

    function showUploadModal() { 
        document.getElementById('uploadModal').style.display = 'flex'; 
        resetCategorySelection(); 
    }
    
    function closeModal(id) { document.getElementById(id).style.display = 'none'; }
    
    function resetCategorySelection() { 
        document.querySelectorAll('.tc-cat-opt').forEach(el => el.classList.remove('selected')); 
        window._selectedTempCat = null; 
    }
    
    document.querySelectorAll('.tc-cat-opt').forEach(opt => {
        opt.addEventListener('click', () => {
            document.querySelectorAll('.tc-cat-opt').forEach(el => el.classList.remove('selected'));
            opt.classList.add('selected');
            window._selectedTempCat = opt.getAttribute('data-cat');
        });
    });

    function dragOverHandler(e) { e.preventDefault(); document.getElementById('dropZone').classList.add('drag-over'); }
    function dragLeaveHandler(e) { document.getElementById('dropZone').classList.remove('drag-over'); }
    function dropHandler(e) { e.preventDefault(); const file = e.dataTransfer.files[0]; if (file) processCSVFile(file); }
    function handleFileSelect(e) { if (e.target.files[0]) processCSVFile(e.target.files[0]); }

    function showColumnManager() { 
        if (!state.allColumns.length) { alert("Cargue CSV primero"); return; } 
        renderColumnList(); 
        document.getElementById('columnsModal').style.display = 'flex'; 
    }
    
    function renderColumnList() {
        const filterText = document.getElementById('colFilterInput')?.value.toLowerCase() || '';
        const container = document.getElementById('columnListContainer');
        container.innerHTML = '';
        const listDiv = document.createElement('div');
        listDiv.style.cssText = 'max-height:350px; overflow-y:auto;';

        state.columnConfig.forEach((col, idx) => {
            if (filterText && !col.orig.toLowerCase().includes(filterText) && !col.label.toLowerCase().includes(filterText)) return;
            const item = document.createElement('div');
            item.className = 'col-item';
            item.draggable = true;
            item.dataset.idx = idx;
            item.innerHTML = `
                <span class="col-drag-handle">⠿</span>
                <input type="checkbox" ${col.visible ? 'checked' : ''} id="col_${idx}">
                <span style="width:130px; font-weight:500; font-size:12px; overflow:hidden; text-overflow:ellipsis;">${escapeHtml(col.orig)}</span>
                <input type="text" value="${escapeHtml(col.label)}" style="flex:1; padding:5px 10px; border-radius:12px; border:1px solid #CAD5E2; font-size:12px;">
            `;
            // Checkbox
            item.querySelector('input[type=checkbox]').addEventListener('change', function() {
                state.columnConfig[idx].visible = this.checked;
            });
            // Label edit
            item.querySelector('input[type=text]').addEventListener('change', function() {
                state.columnConfig[idx].label = this.value;
            });
            // Drag events
            item.addEventListener('dragstart', (e) => {
                e.dataTransfer.effectAllowed = 'move';
                e.dataTransfer.setData('text/plain', idx);
                setTimeout(() => item.classList.add('dragging'), 0);
            });
            item.addEventListener('dragend', () => {
                item.classList.remove('dragging');
                document.querySelectorAll('.col-item').forEach(el => el.classList.remove('drag-over'));
            });
            item.addEventListener('dragover', (e) => {
                e.preventDefault();
                e.dataTransfer.dropEffect = 'move';
                document.querySelectorAll('.col-item').forEach(el => el.classList.remove('drag-over'));
                item.classList.add('drag-over');
            });
            item.addEventListener('drop', (e) => {
                e.preventDefault();
                const fromIdx = parseInt(e.dataTransfer.getData('text/plain'));
                const toIdx = idx;
                if (fromIdx !== toIdx) {
                    const moved = state.columnConfig.splice(fromIdx, 1)[0];
                    state.columnConfig.splice(toIdx, 0, moved);
                    renderColumnList();
                }
            });
            listDiv.appendChild(item);
        });
        container.appendChild(listDiv);
    }
    
    function selectAllColumns(visible) {
        state.columnConfig.forEach(col => col.visible = visible);
        renderColumnList();
    }
    
    function applyColumnChanges() { 
        closeModal('columnsModal'); 
        applyFiltersAndRender(); 
        updateColumnSelector(); 
    }

    function exportToExcel() {
        if (!state.filteredRows.length) { alert("Sin datos para exportar"); return; }
        // Exportar TODAS las columnas (visibles y ocultas), en el orden actual
        const allCols = state.columnConfig;
        const headers = allCols.map(c => c.label);
        const sheetRows = state.filteredRows.map(row => allCols.map(c => row[c.orig] !== undefined ? row[c.orig] : ''));
        const ws = XLSX.utils.aoa_to_sheet([headers, ...sheetRows]);
        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, state.currentCategory || "datos");
        XLSX.writeFile(wb, `TECSYCOM_${state.currentCategory || 'export'}_${new Date().toISOString().slice(0, 10)}.xlsx`);
    }

    function updateGlobalBadge() {
        const badge = document.getElementById('globalCatBadge');
        const cat = state.currentCategory;
        let text = "Sin categoría";
        if (cat === "ALTA") text = "📋 Altas";
        else if (cat === "AVERIA") text = "⚠️ Averías";
        else if (cat === "GARANTIA") text = "🛡️ Garantía";
        else if (cat === "POSTVENTA") text = "📞 Postventa";
        badge.innerText = text;
    }

    function escapeHtml(str) { return String(str || "").replace(/[&<>]/g, m => m === '&' ? '&amp;' : m === '<' ? '&lt;' : '&gt;'); }

    // Eventos de búsqueda
    document.getElementById('specificSearchInput')?.addEventListener('input', (e) => { state.searchKeyword = e.target.value; applyFiltersAndRender(); });
    document.getElementById('colFilterInput')?.addEventListener('input', () => renderColumnList());

    // Exportar funciones globales
    window.setSortColumn = setSortColumn; window.changePage = changePage; window.showColumnManager = showColumnManager;
    window.applyColumnChanges = applyColumnChanges; window.exportToExcel = exportToExcel; window.showUploadModal = showUploadModal;
    window.closeModal = closeModal; window.processCSVFile = processCSVFile; window.dragOverHandler = dragOverHandler;
    window.dragLeaveHandler = dragLeaveHandler; window.dropHandler = dropHandler; window.handleFileSelect = handleFileSelect;
    window.updateEstadoValue = updateEstadoValue; window.startInlineEdit = startInlineEdit; window.filterByEstado = filterByEstado;
    window.selectAllColumns = selectAllColumns;

    applyFiltersAndRender();
</script>
</body>
</html>
