<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>TECSYCOM PRO FINAL</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

<style>
:root {
  --bg: #f4f6fb;
  --surface: #ffffff;
  --surface2: #eef2f7;
  --border: #d9e1ec;
  --border2: #c7d2e0;
  --accent: #2563eb;
  --ok: #16a34a;
  --text: #1e293b;
}

body {
  background: var(--bg);
  font-family: Arial, sans-serif;
}

/* UPLOAD BOX */
#upload-drop {
  border: 2px dashed var(--border2);
  border-radius: 14px;
  padding: 50px;
  text-align: center;
  cursor: pointer;
  background: var(--surface);
  margin: 50px;
  transition: all 0.25s ease;
}

/* HOVER */
#upload-drop:hover {
  transform: scale(1.02);
  border-color: var(--accent);
  box-shadow: 0 10px 30px rgba(0,0,0,0.08);
}

/* DRAG */
#upload-drop.drag-over {
  transform: scale(1.05);
  border-color: var(--accent);
  background: rgba(37,99,235,0.05);
}

/* ICON */
.upload-icon {
  font-size: 50px;
  margin-bottom: 10px;
  transition: transform .3s ease;
}

#upload-drop:hover .upload-icon {
  transform: translateY(-5px) scale(1.1);
}

.btn {
  background: var(--accent);
  color: white;
  padding: 12px 25px;
  border-radius: 8px;
  display: inline-block;
  margin-top: 20px;
  transition: all .2s ease;
}

.btn:hover {
  transform: translateY(-2px);
}
</style>
</head>

<body>

<div id="upload-drop"
     onclick="document.getElementById('file-input').click()"
     ondragover="event.preventDefault();this.classList.add('drag-over')"
     ondragleave="this.classList.remove('drag-over')"
     ondrop="handleDrop(event)">

  <input type="file" id="file-input" accept=".xlsx,.xls"
         style="display:none;"
         onchange="handleFileInput(event)"/>

  <div class="upload-icon">📁</div>
  <h2>Cargar archivo Excel</h2>
  <p>Haz clic o arrastra tu archivo</p>

  <div class="btn">Seleccionar archivo</div>

</div>

<script>

function handleFileInput(e) {
  const file = e.target.files[0];
  if (!file) return;

  const box = document.getElementById('upload-drop');

  // feedback visual
  box.style.borderColor = "var(--ok)";
  box.style.background = "rgba(22,163,74,0.05)";

  setTimeout(()=>{
    box.style.borderColor = "";
    box.style.background = "";
  },1500);

  processFile(file);
}

function handleDrop(e) {
  e.preventDefault();
  const box = document.getElementById('upload-drop');
  box.classList.remove('drag-over');

  const file = e.dataTransfer.files[0];
  if (file) processFile(file);
}

function processFile(file) {
  const reader = new FileReader();

  reader.onload = function(e) {
    const data = new Uint8Array(e.target.result);
    const workbook = XLSX.read(data, { type: 'array' });

    console.log("Excel cargado:", workbook.SheetNames);
    alert("Archivo cargado correctamente: " + file.name);
  };

  reader.readAsArrayBuffer(file);
}

</script>

</body>
</html>
