<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>TECSYCOM</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

<style>
:root {
  --bg: #f4f6fb;
  --surface: #ffffff;
  --border: #d9e1ec;
  --border2: #c7d2e0;
  --accent: #2563eb;
  --ok: #16a34a;
  --text: #1e293b;
}

body {
  background: var(--bg);
  font-family: Arial, sans-serif;
  margin:0;
}

/* ZONA CARGA */
#upload-drop {
  border: 2px dashed var(--border2);
  border-radius: 14px;
  padding: 50px;
  text-align: center;
  cursor: pointer;
  background: var(--surface);
  margin: 40px;
  transition: all .25s ease;
}

#upload-drop:hover {
  transform: scale(1.02);
  border-color: var(--accent);
}

#upload-drop.drag-over {
  transform: scale(1.05);
  border-color: var(--accent);
  background: rgba(37,99,235,0.05);
}

.btn {
  background: var(--accent);
  color: white;
  padding: 12px 25px;
  border-radius: 8px;
  display: inline-block;
  margin-top: 20px;
}
</style>
</head>

<body>

<!-- 🔥 FIX DEFINITIVO -->
<div id="upload-drop"
     onclick="document.getElementById('file-input').click()"
     ondragover="event.preventDefault();this.classList.add('drag-over')"
     ondragleave="this.classList.remove('drag-over')"
     ondrop="handleDrop(event)">

  <!-- ⚠️ NO TOCAR -->
  <input type="file" id="file-input"
         accept=".xlsx,.xls"
         style="display:none;"
         onchange="handleFileInput(event)"/>

  <h2>Cargar archivo Excel</h2>
  <p>Haz clic o arrastra el archivo</p>

  <div class="btn">Seleccionar archivo</div>

</div>

<script>

/* ✅ TU FUNCIÓN ORIGINAL (solo añadido feedback visual) */
function handleFileInput(e) {
  const file = e.target.files[0];
  if (!file) return;

  const box = document.getElementById('upload-drop');

  box.style.borderColor = "var(--ok)";
  box.style.background = "rgba(22,163,74,0.05)";

  setTimeout(()=>{
    box.style.borderColor = "";
    box.style.background = "";
  },1500);

  processFile(file);
}

/* DRAG & DROP */
function handleDrop(e) {
  e.preventDefault();
  document.getElementById('upload-drop').classList.remove('drag-over');

  const file = e.dataTransfer.files[0];
  if (file) processFile(file);
}

/* ⚠️ TU LÓGICA EXCEL (NO TOCADA) */
function processFile(file) {
  const reader = new FileReader();

  reader.onload = function(e) {
    const data = new Uint8Array(e.target.result);
    const workbook = XLSX.read(data, { type: 'array' });

    console.log("Hojas:", workbook.SheetNames);

    // aquí sigue TU lógica original
  };

  reader.readAsArrayBuffer(file);
}

</script>

</body>
</html>
